      - name: Summarize all five attempts
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'agent-handoff-diag'
          results = [json.loads(path.read_text()) for path in sorted(directory.glob('attempt-*.json'))]
          failed = sum(row['result'] == 'fail' for row in results)
          summary = {'ref': os.environ['DIAG_REF'], 'sha': os.environ['DIAG_SHA'],
                     'attempts': len(results), 'failed': failed, 'passed': len(results) - failed}
          print('DIAG_SUMMARY ' + json.dumps(summary))
          directory.mkdir(parents=True, exist_ok=True)
          (directory / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f"## {summary['ref']} ({summary['sha']})\n\n")
              stream.write(f"{failed}/{len(results)} attempts failed.\n\n")
              for row in results:
                  stream.write(f"- Attempt {row['attempt']}: {row['result']}, {row['wall_seconds']} s; "
