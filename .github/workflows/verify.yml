name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reclaim unused hosted runner toolchain space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          # This disposable JavaScript job does not use Android, .NET, or Haskell.
          # Keep Node, browser dependencies, the checkout, and caches intact.
          printf 'Filesystem space before toolchain cleanup\n'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          printf 'Filesystem space after toolchain cleanup\n'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        env:
          DEBUG: pw:install
      - run: pnpm verify
