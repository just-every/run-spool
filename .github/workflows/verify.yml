name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Only the newest same-repository push run of this workflow is evidence.
          # PRs test merge refs; dispatches may select subsets; this run cannot prove itself.
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          # Main can reuse a green branch push on this exact SHA.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # An identical tree can reuse only its parent's newest green push.
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          # A same-repository PR may pass without shards only after its head's push is green.
          # Red, absent or timed-out evidence falls back to the complete verification.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check source and portable contract
        run: |
          pnpm run check -- --profile first-party
          pnpm source:check
          node scripts/edition-authoring/cli.mjs verify-base --offline
      - name: Build application
        run: pnpm run build:app
      - name: Check integration and types
        run: |
          pnpm integration:check
          pnpm typecheck
      - uses: actions/upload-artifact@v4
        with:
          name: verify-build
          # Only build output, including hidden Vite manifests and asset rules.
          # Never transfer local settings, state, or installation data.
          path: |
            dist/
            public/errors-capture.js
            !dist/**/.dev.vars*
            !dist/**/.env*
            !dist/**/.wrangler/**
            !dist/**/.rer/**
            !dist/**/.seed/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  tests:
    name: verify (${{ matrix.shard }})
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # sd-spool-disk measured a 1.708 GiB peak on cbc874e; retain the guard with margin.
      RER_SERVERS_DISK_FLOOR_GIB: '4'
      # The Cloudflare Vite plugin says why it restarts the dev server (a config change or a
      # workerd crash) only under this flag; the kept server output below then carries it.
      NODE_DEBUG: '@cloudflare:vite-plugin'
    strategy:
      fail-fast: false
      matrix:
        # Keep every suite and SDK runtime in eight groups sharing the build artifact.
        include:
          - shard: runtime
            browser: true
            runtimes: ""
            command: node tests/demo-capture.mjs && node tests/deployment-history.mjs && node tests/audit-history.mjs && node tests/old-archive.mjs && pnpm test:runtime && pnpm test:product && pnpm test:origins && pnpm test:dev-credentials
          - shard: sdk
            browser: true
            runtimes: ""
            command: pnpm test:sentry && pnpm test:sentry:sdk && pnpm test:sdk && pnpm test:languages
          - shard: repair-recovery
            browser: true
            runtimes: ""
            command: pnpm test:repair-recovery
          - shard: project-erasure
            browser: true
            runtimes: ""
            command: pnpm test:project-erasure && pnpm test:sentry:cli
          - shard: alerts
            browser: true
            runtimes: ""
            command: pnpm test:alerts && pnpm test:alerts-ui && pnpm test:owner-erasure
          - shard: agent-handoff
            browser: true
            runtimes: ""
            command: pnpm test:project-erasure-cap && pnpm test:agent-handoff && pnpm test:privacy
          - shard: owner-ui
            browser: true
            runtimes: "elixir go python"
            command: pnpm test:accessibility && pnpm test:admission
          - shard: execution
            browser: true
            runtimes: "electron java ruby dotnet rust node php"
            command: pnpm test:execution && pnpm test:wizard && pnpm test:tunnel
    steps:
      # Keep the default checkout root on every runner: emitted configs can
      # contain absolute paths from the build job's checkout.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: verify-build
          path: .
      - if: contains(matrix.runtimes, 'python')
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: contains(matrix.runtimes, 'go')
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - if: contains(matrix.runtimes, 'java')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: contains(matrix.runtimes, 'ruby')
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - if: contains(matrix.runtimes, 'php')
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - if: contains(matrix.runtimes, 'dotnet')
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - if: contains(matrix.runtimes, 'elixir')
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - if: contains(matrix.runtimes, 'rust')
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ${{ runner.temp }}/cargo-target
          key: rust-runtime-${{ hashFiles('tests/runtimes/rust/Cargo.toml') }}
      - name: Install Chromium
        if: matrix.browser
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          if ! pnpm exec node scripts/chromium-probe.mjs; then
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
            pnpm exec node scripts/chromium-probe.mjs
          fi
      - if: contains(matrix.runtimes, 'electron')
        name: Install Electron virtual display
        run: |
          # Base 144aa3ff mirror fallback, adapted for a hosted sudo runner.
          # Three 60s attempts plus kill grace/backoff fit within the existing cap.
          mirrors=(http://azure.archive.ubuntu.com/ubuntu http://mirrors.edge.kernel.org/ubuntu http://us-east-1.ec2.archive.ubuntu.com/ubuntu)
          sudo mkdir -p /var/tmp/spool-electron-apt/archives
          cat <<'APT' | sudo tee /var/tmp/spool-electron-apt/apt.conf > /dev/null
          Dir::Cache::archives "/var/tmp/spool-electron-apt/archives";
          APT::Keep-Downloaded-Packages "true";
          APT::Update::Error-Mode "any";
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
          started=$SECONDS
          for attempt in 1 2 3; do
            mirror=${mirrors[attempt - 1]}
            sudo sed -i -E "s@^(URIs:[[:space:]]*)https?://(([a-z0-9.-]+\.)?archive\.ubuntu\.com|security\.ubuntu\.com|mirrors\.edge\.kernel\.org)/ubuntu/?@\1${mirror}/@" /etc/apt/sources.list.d/ubuntu.sources
            printf 'Electron apt: display attempt %s/3 (60s deadline; mirror %s)\n' "$attempt" "$mirror"
            if sudo env APT_CONFIG=/var/tmp/spool-electron-apt/apt.conf timeout --kill-after=5s 60s bash -ec '
              dpkg --configure -a
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth
            '; then
              printf 'Electron apt: display complete (attempts=%s mirror=%s seconds=%s)\n' "$attempt" "$mirror" "$((SECONDS - started))"
              exit 0
            else
              status=$?
              printf 'Electron apt: display attempt %s/3 failed (mirror %s, exit %s, seconds=%s)\n' "$attempt" "$mirror" "$status" "$((SECONDS - started))" >&2
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 2))"; fi
          done
          printf 'Electron apt: display failed after 3 attempts (exit %s; seconds=%s)\n' "$status" "$((SECONDS - started))" >&2
          exit 1
      - name: Run suites
        run: ${{ matrix.command }}
      - name: Run SDK journeys
        if: matrix.runtimes != ''
        env:
          SDK_RUNTIMES: ${{ matrix.runtimes }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: |
          read -r -a runtimes <<< "$SDK_RUNTIMES"
          if [[ " ${runtimes[*]} " == *" electron "* ]]; then
            xvfb-run -a node tests/sdk-runtimes.mjs "${runtimes[@]}"
          else
            node tests/sdk-runtimes.mjs "${runtimes[@]}"
          fi
      - uses: actions/upload-artifact@v4
        if: contains(matrix.runtimes, 'electron') && success()
        with:
          name: electron-screens
          path: .artifacts/runtimes/
          if-no-files-found: error
          retention-days: 7
      # Each journey's dev server (rer, Vite, workerd) and test Worker output, with the
      # checkout's secrets redacted, for diagnosing a failed run.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-output-${{ matrix.shard }}
          path: |
            .artifacts/dev-server/
            .artifacts/worker-output/
            .artifacts/runtimes/
            .artifacts/wave-b/
            .artifacts/latest-product-worker.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Check hosted output and hydration
        if: matrix.shard == 'owner-ui'
        # These are the post-verify:app checks from the pinned rer verify.
        # Node 22 detects module syntax; --input-type breaks Miniflare's file-based worker thread.
        run: |
          node <<'NODE'
          import {checkHostedOutput} from '@runeditrun/rer/internal/cli/hosted-output.mjs';
          import {checkHydration} from '@runeditrun/rer/internal/cli/hydration/check.mjs';
          import {commandAdapter} from './scripts/installer/local.mjs';
          const root = process.cwd();
          const declaration = commandAdapter.deployDeclaration ?? commandAdapter.deploy?.declaration;
          console.log(await checkHostedOutput(root, {declaration}));
          console.log(await checkHydration(root, {pages: commandAdapter.publicPages, declaration}));
          NODE

  verify:
    needs: [plan, build, tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
