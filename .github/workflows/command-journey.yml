name: Command journey

on:
  schedule:
    - cron: '17 15 * * *'
  push:
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commands:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reclaim unused hosted runner toolchain space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          # This disposable JavaScript job does not use Android, .NET, or Haskell.
          # Keep Node, browser dependencies, the checkout, and caches intact.
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        env:
          DEBUG: pw:install
      # The public CLI journey clones HEAD and performs its own installs/builds.
      - run: pnpm test:commands
