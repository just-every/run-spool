name: Run demo
on:
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Use demo-test and the published Turnstile test keys'
        type: boolean
        default: false
      remove:
        description: 'Remove this demo host and its owned container resources'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: run-demo-${{ inputs.test_only && 'test' || 'production' }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: run-demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: corepack enable && pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - name: Limit removal to test host
        if: ${{ inputs.remove && !inputs.test_only }}
        run: echo 'Removal requires test_only=true.' >&2; exit 1
      - name: Scope test deployment
        if: inputs.test_only
        run: node --input-type=module -e "import fs from 'node:fs'; const p='deploy-demo.json'; const d=JSON.parse(fs.readFileSync(p)); d.domain='test.run-spool.com'; fs.writeFileSync(p,JSON.stringify(d));"
      - name: Deploy or remove demo
        run: |
          if [ "$REMOVE" = true ]; then
            pnpm exec rer deploy --demo --remove --yes --environment "$DEMO_ENVIRONMENT"
          else
            pnpm exec rer deploy --demo --environment "$DEMO_ENVIRONMENT"
          fi
        env:
          REMOVE: ${{ inputs.remove }}
          DEMO_ENVIRONMENT: ${{ inputs.test_only && 'demo-test' || 'production' }}
          CLOUDFLARE_ACCOUNT_ID: b20c0ca9cab0c2b70e13d7cf724b89bd
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SITE_KEY: ${{ inputs.test_only && '1x00000000000000000000AA' || vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ inputs.test_only && '1x0000000000000000000000000000000AA' || secrets.TURNSTILE_SECRET_KEY }}
          RER_DEMO_OPERATOR_TOKEN: ${{ secrets.RER_DEMO_OPERATOR_TOKEN }}
      - name: Public readback
        if: ${{ !inputs.remove }}
        run: |
          domain=demo.$(node -p "require('./deploy-demo.json').domain")
          test "$(curl --fail --silent --show-error -o /dev/null -w '%{http_code}' "https://$domain/")" = 200
          ! curl --fail --silent --show-error -D - -o /dev/null "https://$domain/" | grep -qi '^set-cookie:'
