[package]
name = "rer-egress-tls"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
test-roots = []

[dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
ring = { version = "=0.17.14", features = ["wasm32_unknown_unknown_js"] }
wasm-bindgen = "=0.2.114"
js-sys = "=0.3.91"
rustls-pki-types = { version = "=1.15.1", features = ["web"] }
webpki-roots = "=1.0.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
